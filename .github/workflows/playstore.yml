name: Android Beta CI

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up Local Properties
        run: |
            echo "tmdb_token=${{ secrets.TMDB_TOKEN }}" > local.properties
            echo "firebase_beta_id=${{ secrets.FIREBASE_PLAYSTORE_ID }}" >> local.properties

      - name: Set up Google Services
        run: |
          cat << 'EOF' > app/src/playstore/google-services.json
          ${{ secrets.GOOGLE_SERVICES }}
          EOF

      - name: Decode Firebase Distribution services
        run: echo "${{ secrets.FIREBASE_DISTRIBUTION }}" | base64 --decode > firebase-distribution.json

      - name: Create Keystore Properties
        run: |
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
            echo "keyAlias=${{ secrets.KEYSTORE_ALIAS }}" > keystore.properties
            echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
            echo "storeFile=keystore.jks" >> keystore.properties
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
            pwd

      - name: Run Fastlane Release
        run: |
          bundle exec fastlane test
          bundle exec fastlane release_play_store
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Clean sensitive files
        if: always()
        run: |
          rm -f app/google-services.json
          rm -f firebase-distribution.json
          rm -f keystore.jks
          rm -f keystore.properties
          rm -f local.properties