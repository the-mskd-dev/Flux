name: Android Beta CI

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: gradle

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Create Keystore Properties
        run: |
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
            echo "keyAlias=${{ secrets.KEYSTORE_ALIAS }}" > keystore.properties
            echo "keyPassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
            echo "storeFile=keystore.jks" >> keystore.properties
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
            pwd

      - name: Remove Google dependencies to keep code FOSS
        run: sed -i '/PLAY_STORE/d' build.gradle.kts app/build.gradle.kts gradle/libs.versions.toml

      - name: Run Fastlane Release
        run: |
          bundle exec fastlane test_foss
          bundle exec fastlane release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Clean sensitive files
        if: always()
        run: |
          rm -f keystore.jks
          rm -f keystore.properties
          rm -f local.properties