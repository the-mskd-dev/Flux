[versions]
# -- Android SDK --
android-compileSdk = "37"
android-minSdk = "29"
android-targetSdk = "37"

# -- Build & Plugins --
agp = "9.3.1"
kotlin = "2.4.10"
ksp = "2.3.9"
koinPlugin = "1.1.0"
firebaseCrashlyticsPlugin = "3.0.8"
googleServices = "4.5.0"

# -- Compose --
composeMultiplatform = "1.12.1"
composeMaterialAdaptive = "1.3.0-rc01"
compose = "1.13.0-alpha01"

# -- Android Core --
lifecycle = "2.11.0"

# -- Kotlin --
kotlinxSerializationCore = "1.11.0"

# -- UI --
haze = "2.0.1"

# -- Navigation --
nav3Core = "1.1.6"

# -- DI --
koin = "4.2.2"

# -- Data --
datastore = "1.2.1"
room = "2.8.4"

# -- Network --
ktor = "3.5.2"

# -- Media --
media3 = "1.11.0"

# -- Image --
coil = "3.5.0"

# -- ACRA --
acra = "5.13.1"

# -- Testing --
kotest = "6.2.4"
mockk = "1.14.11"

[libraries]

# -- Android Core --
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.19.0" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.13.0" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version = "1.1.0" }

# -- Compose --
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version = "2026.08.00" }
androidx-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

# -- Compose Multiplatform --
components-resources = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "composeMultiplatform" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "compose" }
compose-ui-graphics = { group = "org.jetbrains.compose.ui", name = "ui-graphics", version.ref = "compose" }
compose-ui-text = { group = "org.jetbrains.compose.ui", name = "ui-text", version.ref = "compose" }
compose-ui-tooling-preview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "compose" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version = "1.13.0-alpha01" }
compose-constraintlayout = { group = "tech.annexflow.compose", name = "constraintlayout-compose-multiplatform", version = "0.8.2" }
compose-material-icons = { group = "org.jetbrains.compose.material", name = "material-icons-core", version = "1.7.3" }
compose-material-adaptive = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive", version.ref = "composeMaterialAdaptive" }
compose-material-adaptive-navigation = { group = "org.jetbrains.compose.material3.adaptive", name = "adaptive-navigation3", version.ref = "composeMaterialAdaptive" }

# -- Kotlin --
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerializationCore" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationCore" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version = "0.5.1" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version = "0.8.0" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }

# -- UI --
haze-core = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
haze-blur = { group = "dev.chrisbanes.haze", name = "haze-blur", version.ref = "haze" }
haze-blur-materials = { group = "dev.chrisbanes.haze", name = "haze-blur-material3", version.ref = "haze" }
material-kolor = { group = "com.materialkolor", name = "material-kolor", version = "5.0.1" }

# -- Navigation --
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "nav3Core" }
androidx-lifecycle-viewmodel-nav3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
compose-navigation = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version = "2.10.0-beta01" }

# -- Accompanist --
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version = "0.37.3" }

# -- Media --
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose-material3", version.ref = "media3" }
jellyfin-ffmpeg = { group = "org.jellyfin.media3", name = "media3-ffmpeg-decoder", version = "1.9.0+1" }

# -- Image --
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt.coil3", name = "coil-video", version.ref = "coil" }
coil-network-ktor = { group = "io.coil-kt.coil3", name = "coil-network-ktor3", version.ref = "coil" }

# -- Network --
ktor-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-android = { group = "io.ktor", name = "ktor-client-android", version.ref = "ktor" }
ktor-http = { group = "io.ktor", name = "ktor-http", version.ref = "ktor" }

# -- DI --
koin-core = { group = "io.insert-koin", name = "koin-core", version.ref = "koin" }
koin-annotations = { group = "io.insert-koin", name = "koin-annotations", version.ref = "koin" }
koin-compose = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android", version.ref = "koin" }

# -- Data --
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
androidx-datastore-pref = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version = "2.7.0" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# -- Log --
napier = { group = "io.github.aakira", name = "napier", version = "2.7.1" }

# -- ACRA --
acra-core = { group = "ch.acra", name = "acra-core", version.ref = "acra" }
acra-mail = { group = "ch.acra", name = "acra-mail", version.ref = "acra" }
acra-dialog = { group = "ch.acra", name = "acra-dialog", version.ref = "acra" }

# -- Firebase --
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version = "34.19.0" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }

# -- Testing --
junit = { group = "junit", name = "junit", version = "4.13.2" }
kotest = { group = "io.kotest", name = "kotest-runner-junit5", version.ref = "kotest"}
kotest-property = { group = "io.kotest", name = "kotest-property", version.ref = "kotest" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version = "5.5.0" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
turbine = { group = "app.cash.turbine", name = "turbine", version = "1.2.1" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version = "1.11.0" }
koin-test = { group = "io.insert-koin", name = "koin-test", version.ref = "koin" }
koin-test-junit4 = { group = "io.insert-koin", name = "koin-test-junit4", version.ref = "koin" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version = "2.3.21" }
androidx-test-ext = { group = "androidx.test.ext", name = "junit", version = "1.3.0" }
androidx-test-espresso = { group = "androidx.test.espresso", name = "espresso-core", version = "3.7.0" }
truth = { group = "com.google.truth", name = "truth", version = "1.4.5" }
androidx-core-testing = { group = "androidx.arch.core", name = "core-testing", version = "2.2.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"}
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koinPlugin" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsPlugin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }

[bundles]

# -- Shared --
shared-kotlin = [
    "kotlinx-serialization-json",
    "kotlinx-serialization-core",
    "kotlinx-collections-immutable",
    "kotlinx-datetime"
]
shared-network = [
    "ktor-core",
    "ktor-negotiation",
    "ktor-json",
    "ktor-http"
]
shared-di = [
    "koin-core",
    "koin-annotations",
    "koin-compose",
    "koin-compose-viewmodel",
]
shared-image = [
    "coil-network-ktor",
    "coil-video",
    "coil-compose",
]
shared-room = [
    "androidx-sqlite-bundled",
    "androidx-room-runtime",
    "androidx-room-ktx"
]
shared-datastore = [
    "androidx-datastore",
    "androidx-datastore-pref",
]
shared-tools = [
    "napier"
]
shared-ui = [
    "haze-core",
    "haze-blur",
    "haze-blur-materials",
    "material-kolor",
    "compose-material3",
    "compose-ui",
    "compose-ui-text",
    "compose-ui-graphics",
    "components-resources",
    "compose-ui-tooling-preview",
    "compose-constraintlayout",
    "compose-material-icons",
    "compose-material-adaptive",
    "compose-material-adaptive-navigation",
    "compose-navigation"
]

# -- Android --

android-core = [
    "androidx-core-ktx",
    "androidx-lifecycle-runtime-ktx",
    "androidx-runtime-livedata",
    "androidx-documentfile"
]

android-network = [
    "ktor-okhttp",
    "ktor-android"
]

android-compose = [
    "androidx-lifecycle-viewmodel-compose",
    "androidx-activity-compose"
]

android-compose-debug = [
    "androidx-ui-tooling",
    "androidx-ui-test-manifest"
]

android-navigation = [
    "androidx-navigation3-runtime",
    "androidx-navigation3-ui",
    "androidx-lifecycle-viewmodel-nav3",
]

android-accompanist = [
    "accompanist-permissions"
]

android-player = [
    "androidx-media3-exoplayer",
    "androidx-media3-ui",
    "androidx-media3-ui-compose",
    "androidx-media3-session",
    "jellyfin-ffmpeg",
]

android-di = [
    "koin-android",
]

android-acra = [
    "acra-core",
    "acra-mail",
    "acra-dialog"
]

android-firebase = ["firebase-crashlytics", "firebase-analytics"] # PLAY_STORE

android-unit-test = [
    "junit",
    "kotest",
    "kotest-property",
    "mockwebserver",
    "mockk",
    "koin-test",
    "koin-test-junit4",
    "turbine",
    "kotlinx-coroutines-test"
]

android-test = [
    "androidx-test-ext",
    "androidx-test-espresso",
    "truth",
    "androidx-core-testing",
    "mockk-android",
    "turbine",
    "koin-test"
]
